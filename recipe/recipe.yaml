context:
  version: "0.11.5"
  python_min: '3.11'

package:
  name: array-api-extra
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/array-api-extra/array_api_extra-${{ version }}.tar.gz
  sha256: 1f0de7dde3326a7157a63ddbcfab7409b38248f0685e5a0670bd9044a54fcac0

build:
  number: 0
  noarch: python
  script: uv pip install --python ${{ PYTHON }} . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv
    - meson-python
  run:
    - python >=${{ python_min }}
    - array-api-compat

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - array_api_extra
  - script:
      - pytest -ra tests/main
    requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - pytest
        - array-api-strict
        - numpy
        - hypothesis
    files:
      source:
        - tests/
        - pyproject.toml

about:
  summary: Extra array functions built on top of the array API standard.
  description: Extra array functions built on top of the array API standard.
  license: MIT
  license_file: LICENSE
  homepage: https://data-apis.org/array-api-extra/
  repository: https://github.com/data-apis/array-api-extra
  documentation: https://data-apis.org/array-api-extra/

extra:
  recipe-maintainers:
    - lucascolley
